<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>رشفة | لوحة التحكم</title>
<meta name="theme-color" content="#3E0F1C">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 2C12 2 5 11.5 5 15.5C5 19.6 8.4 22 12 22C15.6 22 19 19.6 19 15.5C19 11.5 12 2 12 2Z' fill='%236E2035'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Reem+Kufi:wght@600;700&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css?v=19">
<style>
  body{ min-height:100vh; }
  body::after{ display:none; }
  .ad-wrap{ max-width: 1100px; margin-inline:auto; padding: 20px 16px 60px; }
  .ad-card{ background: var(--cream-50); border-radius: 22px; box-shadow: var(--shadow-1), inset 0 0 0 1px var(--line); }
  .ad-muted{ opacity:.65; font-size: 13.5px; }
  .ad-err{ color:#B03A2E; font-weight:700; font-size: 13.5px; min-height: 1.2em; margin-top: 10px; }

  /* الدخول */
  .ad-login{ min-height: 100vh; display:grid; place-items:center; padding: 20px; }
  .ad-login form{ width: min(100%, 400px); padding: 34px 28px; text-align:center; }
  .ad-login .brand{ justify-content:center; font-size: 40px; }
  .ad-login h1{ font-family: var(--font-display); font-size: 22px; color: var(--maroon-900); margin: 6px 0 22px; }
  .ad-login .om-field{ text-align:start; }
  .ad-login .btn{ width:100%; margin-top: 8px; }

  /* الرأس */
  .ad-top{ display:flex; align-items:center; justify-content:space-between; gap: 12px; flex-wrap:wrap; margin-bottom: 18px; }
  .ad-top .brand{ font-size: 30px; }
  .ad-top .brand small{ font-family:'Tajawal',sans-serif; font-size: 13px; color: var(--wood-600); font-weight:800; margin-inline-start: 6px; }
  .ad-me{ display:flex; align-items:center; gap: 10px; font-weight:700; font-size: 14px; }
  .ad-role{ font-size: 11.5px; font-weight:800; padding: 3px 10px; border-radius: 999px; background: var(--wood-400); color: var(--maroon-950); }
  .ad-role.staff{ background: var(--cream-200); color: var(--maroon-900); }
  .ad-btn-sm{ padding: 7px 14px; font-size: 13px; }

  /* التبويبات */
  .ad-tabs{ display:flex; gap: 6px; padding: 5px; border-radius: 999px; background: var(--cream-50); box-shadow: inset 0 0 0 1px var(--line); width: max-content; max-width:100%; overflow-x:auto; margin-bottom: 18px; }
  .ad-tab{ border:0; background:none; font: inherit; font-weight:800; font-size: 14px; color: var(--maroon-900); padding: 9px 18px; border-radius: 999px; cursor:pointer; white-space:nowrap; }
  .ad-tab[aria-selected="true"]{ background: var(--maroon-900); color: var(--cream-50); }
  .ad-tab .n{ display:inline-grid; place-items:center; min-width: 20px; height: 20px; padding: 0 6px; margin-inline-start: 6px; border-radius: 999px; background: var(--wood-400); color: var(--maroon-950); font-size: 11px; }

  .ad-bar{ display:flex; align-items:center; justify-content:space-between; gap: 10px; flex-wrap:wrap; margin-bottom: 14px; }
  .ad-bar h2{ font-family: var(--font-display); font-size: 24px; color: var(--maroon-900); }
  .ad-chips{ display:flex; gap: 6px; flex-wrap:wrap; }
  .ad-chip{ border:0; font: inherit; font-size: 12.5px; font-weight:800; padding: 6px 12px; border-radius: 999px; cursor:pointer; background: var(--cream-50); color: var(--maroon-900); box-shadow: inset 0 0 0 1px var(--line); }
  .ad-chip[aria-pressed="true"]{ background: var(--maroon-700); color: var(--cream-50); box-shadow:none; }
  .ad-empty{ padding: 40px 20px; text-align:center; }

  /* الطلبات */
  .ad-orders{ display:grid; gap: 12px; }
  .ad-order{ padding: 16px 18px; display:grid; grid-template-columns: 1fr auto; gap: 8px 16px; border-inline-start: 5px solid var(--wood-400); }
  .ad-order[data-status="pending"]{ border-inline-start-color: #D4A017; }
  .ad-order[data-status="confirmed"]{ border-inline-start-color: #2E6DA4; }
  .ad-order[data-status="delivered"]{ border-inline-start-color: #2E7D4F; }
  .ad-order[data-status="cancelled"]{ border-inline-start-color: #9A9A9A; opacity:.7; }
  .ad-order h3{ font-size: 17px; font-weight:900; color: var(--maroon-900); }
  .ad-order h3 .id{ font-size: 12.5px; font-weight:800; color: var(--wood-600); margin-inline-start: 8px; }
  .ad-order .meta{ display:flex; flex-wrap:wrap; gap: 4px 14px; font-size: 13.5px; margin-top: 4px; }
  .ad-order .meta a{ color: var(--maroon-700); font-weight:800; text-decoration: underline; text-underline-offset: 3px; }
  .ad-order .items{ grid-column: 1 / -1; display:flex; flex-wrap:wrap; gap: 6px; }
  .ad-order .items span{ font-size: 12.5px; font-weight:700; background: var(--cream-100); padding: 4px 10px; border-radius: 999px; }
  .ad-order .note{ grid-column: 1 / -1; font-size: 13px; background: #fff8e8; padding: 8px 12px; border-radius: 12px; }
  .ad-order .side{ display:flex; flex-direction:column; align-items:flex-end; gap: 8px; }
  .ad-order .total{ font-size: 20px; font-weight:900; color: var(--maroon-900); white-space:nowrap; }
  .ad-select{ font: inherit; font-size: 13px; font-weight:800; padding: 7px 10px; border-radius: 12px; border: 0; background: #fff; box-shadow: inset 0 0 0 1.5px var(--line); color: var(--maroon-900); cursor:pointer; }

  /* المنتجات */
  .ad-products{ display:grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
  .ad-product{ overflow:hidden; display:flex; flex-direction:column; }
  .ad-product img, .ad-product .ph{ width:100%; aspect-ratio: 16/10; object-fit:cover; background: var(--cream-200); display:block; }
  .ad-product .body{ padding: 14px 16px 16px; display:flex; flex-direction:column; gap: 4px; flex:1; }
  .ad-product .row{ display:flex; justify-content:space-between; align-items:center; gap: 8px; }
  .ad-product b{ font-size: 16px; color: var(--maroon-900); }
  .ad-product .pr{ font-weight:900; color: var(--maroon-700); white-space:nowrap; }
  .ad-product .hidden-tag{ font-size: 11px; font-weight:800; background:#eee; padding: 2px 8px; border-radius: 999px; }
  .ad-product .acts{ display:flex; gap: 6px; margin-top: auto; padding-top: 10px; }
  .ad-link{ border:0; background:none; font: inherit; font-size: 13px; font-weight:800; color: var(--maroon-700); cursor:pointer; padding: 6px 8px; border-radius: 10px; }
  .ad-link:hover{ background: var(--cream-100); }
  .ad-link.danger{ color:#B03A2E; }

  /* الفريق */
  .ad-users{ display:grid; gap: 10px; }
  .ad-user{ padding: 14px 18px; display:flex; align-items:center; justify-content:space-between; gap: 12px; flex-wrap:wrap; }
  .ad-user .who{ display:flex; align-items:center; gap: 12px; }
  .ad-avatar{ width: 42px; height: 42px; border-radius: 50%; display:grid; place-items:center; background: linear-gradient(150deg, var(--maroon-700), var(--maroon-950)); color: var(--wood-400); font-weight:900; }
  .ad-user .u{ font-size: 12.5px; opacity:.6; direction:ltr; text-align:end; }

  /* النوافذ */
  .ad-modal{ position:fixed; inset:0; z-index:100; display:grid; place-items:center; padding: 16px; background: rgba(46,10,21,.55); backdrop-filter: blur(5px); }
  .ad-modal form{ width: min(100%, 520px); max-height: calc(100dvh - 32px); overflow-y:auto; padding: 26px 22px; }
  .ad-modal h3{ font-family: var(--font-display); font-size: 24px; color: var(--maroon-900); margin-bottom: 14px; }
  .ad-grid2{ display:grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  .ad-img-pick{ display:flex; align-items:center; gap: 12px; }
  .ad-img-pick img{ width: 96px; height: 72px; object-fit:cover; border-radius: 12px; background: var(--cream-200); }
  .ad-check{ display:flex; align-items:center; gap: 8px; font-weight:700; font-size: 14px; margin: 6px 0 4px; }
  .ad-actions{ display:flex; gap: 10px; justify-content:flex-start; margin-top: 16px; }
  .ad-toast{ position:fixed; z-index:120; bottom: 20px; left:50%; transform: translateX(-50%); background: var(--maroon-900); color: var(--cream-50); padding: 10px 18px; border-radius: 999px; font-weight:800; font-size: 14px; box-shadow: var(--shadow-2); }
  @media (max-width: 600px){
    .ad-order{ grid-template-columns: 1fr; }
    .ad-order .side{ align-items:flex-start; flex-direction:row; justify-content:space-between; }
    .ad-grid2{ grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<!-- الدخول -->
<section class="ad-login" id="login" hidden>
  <form class="ad-card" novalidate>
    <span class="brand"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2C12 2 5 11.5 5 15.5C5 19.6 8.4 22 12 22C15.6 22 19 19.6 19 15.5C19 11.5 12 2 12 2Z"/></svg>رشفة</span>
    <h1>لوحة التحكم</h1>
    <label class="om-field"><span>اسم المستخدم</span><input name="username" autocomplete="username" dir="ltr" required></label>
    <label class="om-field"><span>كلمة المرور</span><input name="password" type="password" autocomplete="current-password" dir="ltr" required></label>
    <button class="btn btn-primary" type="submit">دخول</button>
    <p class="ad-err" data-err></p>
  </form>
</section>

<!-- اللوحة -->
<div class="ad-wrap" id="app" hidden>
  <header class="ad-top">
    <a class="brand" href="index.html"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2C12 2 5 11.5 5 15.5C5 19.6 8.4 22 12 22C15.6 22 19 19.6 19 15.5C19 11.5 12 2 12 2Z"/></svg>رشفة <small>لوحة التحكم</small></a>
    <div class="ad-me"><span data-me-name></span><span class="ad-role" data-me-role></span><button class="btn btn-ghost ad-btn-sm" type="button" data-logout>خروج</button></div>
  </header>

  <nav class="ad-tabs" role="tablist">
    <button class="ad-tab" role="tab" data-tab="orders" aria-selected="true">الطلبات <span class="n" data-pending-count hidden></span></button>
    <button class="ad-tab" role="tab" data-tab="products" data-admin-only aria-selected="false">المنتجات</button>
    <button class="ad-tab" role="tab" data-tab="team" data-admin-only aria-selected="false">الفريق</button>
  </nav>

  <section data-panel="orders">
    <div class="ad-bar">
      <div class="ad-chips" data-filter>
        <button class="ad-chip" type="button" data-f="all" aria-pressed="true">الكل</button>
        <button class="ad-chip" type="button" data-f="pending" aria-pressed="false">قيد الانتظار</button>
        <button class="ad-chip" type="button" data-f="confirmed" aria-pressed="false">مؤكد</button>
        <button class="ad-chip" type="button" data-f="delivered" aria-pressed="false">تم التوصيل</button>
        <button class="ad-chip" type="button" data-f="cancelled" aria-pressed="false">ملغي</button>
      </div>
      <button class="btn btn-ghost ad-btn-sm" type="button" data-refresh>تحديث</button>
    </div>
    <div class="ad-orders" data-orders></div>
  </section>

  <section data-panel="products" hidden>
    <div class="ad-bar"><h2>المنتجات</h2><button class="btn btn-primary ad-btn-sm" type="button" data-new-product>+ إضافة منتج</button></div>
    <div class="ad-products" data-products></div>
  </section>

  <section data-panel="team" hidden>
    <div class="ad-bar"><h2>فريق العمل</h2><button class="btn btn-primary ad-btn-sm" type="button" data-new-user>+ إضافة عضو</button></div>
    <p class="ad-muted" style="margin-bottom:12px">المدير: يدير المنتجات والفريق والطلبات · الموظف: يشوف الطلبات ويغيّر حالتها</p>
    <div class="ad-users" data-users></div>
  </section>
</div>

<!-- نافذة المنتج -->
<div class="ad-modal" id="productModal" hidden>
  <form class="ad-card" novalidate>
    <h3 data-title>إضافة منتج</h3>
    <input type="hidden" name="id">
    <input type="hidden" name="image">
    <div class="om-field"><span>صورة المنتج</span>
      <div class="ad-img-pick"><img alt="" data-preview><div><input type="file" accept="image/*" data-file><p class="ad-muted" data-img-status>تنضغط تلقائياً قبل الرفع</p></div></div>
    </div>
    <label class="om-field"><span>اسم المنتج</span><input name="name" required maxlength="60"></label>
    <div class="ad-grid2">
      <label class="om-field"><span>السعر (ر.ع)</span><input name="price" type="number" step="0.001" min="0" inputmode="decimal" dir="ltr" required></label>
      <label class="om-field"><span>الترتيب في المينيو</span><input name="sort" type="number" min="0" dir="ltr"></label>
    </div>
    <label class="om-field"><span>الوصف</span><textarea name="desc" rows="2" maxlength="240"></textarea></label>
    <div class="ad-grid2">
      <label class="om-field"><span>شارة <small>(مثل: الأكثر طلباً)</small></span><input name="label" maxlength="30"></label>
      <label class="om-field"><span>مميزات <small>(افصل بفاصلة)</small></span><input name="tags" placeholder="قهوة مختصة، مكونات طبيعية"></label>
    </div>
    <label class="ad-check"><input type="checkbox" name="active" checked> ظاهر في الموقع</label>
    <p class="ad-err" data-err></p>
    <div class="ad-actions"><button class="btn btn-primary" type="submit">حفظ</button><button class="btn btn-ghost" type="button" data-cancel>إلغاء</button></div>
  </form>
</div>

<!-- نافذة العضو -->
<div class="ad-modal" id="userModal" hidden>
  <form class="ad-card" novalidate>
    <h3 data-title>إضافة عضو</h3>
    <label class="om-field"><span>الاسم</span><input name="name" maxlength="60"></label>
    <label class="om-field"><span>اسم المستخدم <small>(إنجليزي، بدون مسافات)</small></span><input name="username" dir="ltr" autocomplete="off" required></label>
    <label class="om-field"><span>كلمة المرور <small data-pass-hint>(8 أحرف على الأقل)</small></span><input name="password" type="password" dir="ltr" autocomplete="new-password"></label>
    <label class="om-field"><span>الرتبة</span>
      <select name="role" class="ad-select" style="width:100%;padding:12px 14px;font-size:15px"><option value="staff">موظف — يشوف الطلبات ويغيّر حالتها</option><option value="admin">مدير — صلاحيات كاملة</option></select>
    </label>
    <p class="ad-err" data-err></p>
    <div class="ad-actions"><button class="btn btn-primary" type="submit">حفظ</button><button class="btn btn-ghost" type="button" data-cancel>إلغاء</button></div>
  </form>
</div>

<script src="assets/admin.js?v=19" defer></script>
</body>
</html>
